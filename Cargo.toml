[package]
name = "kubectlUtil"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.11.0", default-features = false, features = ["component", "assets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = "z"     # Otimiza focando no menor tamanho possível (ou "s")
lto = true          # Link Time Optimization: remove código não utilizado entre dependências
codegen-units = 1   # Permite otimização global no binário final
strip = true        # Remove símbolos de debug (maior impacto imediato no .exe)
panic = "abort"     # Remove a infraestrutura de stack unwinding
